<ion-content [fullscreen]="true">
  <ion-header collapse="condense" class="custom-header">
    <ion-toolbar>
      <ion-title size="" class="custom-title">Tu clima favorito</ion-title>
    </ion-toolbar>
  </ion-header>
  
  <ion-list class="custom-list">
    <ion-item *ngFor="let weather of weatherData" class="custom-item">
      <ion-label class="custom-label">
        <h2 *ngIf="weather?.name">{{ weather.name }}</h2>
        <p *ngIf="weather?.main?.temp">Temperatura: {{ weather.main.temp | number:'1.0-0' }} °C</p>
        <p *ngIf="weather?.weather?.[0]?.description">Descripción: {{ weather.weather[0].description }}</p>
      </ion-label>
      <ion-button (click)="removeFavorite(weather.name)" fill="clear" class="custom-button">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item *ngIf="!favoriteCities || favoriteCities.length === 0" class="custom-item no-favorites">
      <ion-label class="custom-label">
        <p>No tienes ciudades favoritas añadidas.</p>
        <p>Añade algunas desde la pestaña de búsqueda.</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
