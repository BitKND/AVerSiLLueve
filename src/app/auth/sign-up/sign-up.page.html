<ion-content [fullscreen]="true">
  <div class="flex-center">
    <ion-card color="light">
      <div class="ion-text ion-padding">
        <ion-buttons slot="start">
          <ion-back-button defaultHref="/sign-in"></ion-back-button>
        </ion-buttons>
      </div>
      <div class="ion-text-center ion-padding">
        <img src="../../../assets/icon/iconlogin.png" alt="Logo de la aplicación" width="50%">
      </div>
      <ion-card-content>
        <ion-card-header>
          <ion-card-title color="primary">¡Regístrate!</ion-card-title>
        </ion-card-header>

        <form [formGroup]="regForm" novalidate>
          <ion-row>
            <ion-col>
              <ion-input formControlName="email" label="Email" labelPlacement="floating" placeholder="Ingrese mail" fill="outline" type="email"></ion-input>
            </ion-col>
          </ion-row>

          <div *ngIf="errorControl['email'].touched && errorControl['email'].invalid">
            <ion-text *ngIf="errorControl['email'].errors?.['required']" color="danger">
              Email requerido.
            </ion-text>
            <ion-text *ngIf="errorControl['email'].errors?.['pattern']" color="danger">
              El email debe ser válido.
            </ion-text>
          </div>

          <ion-row>
            <ion-col>
              <ion-input formControlName="password" label="Contraseña" labelPlacement="floating" placeholder="Ingrese contraseña" fill="outline" type="password"></ion-input>
            </ion-col>
          </ion-row>
          <div *ngIf="errorControl['password'].touched && errorControl['password'].invalid">
            <ion-text *ngIf="errorControl['password'].errors?.['required']" color="danger">
              Contraseña requerida.
            </ion-text>
            <ion-text *ngIf="errorControl['password'].errors?.['pattern']" color="danger">
              La contraseña debe tener: <br>
              - Al menos 8 caracteres. <br>
              - Al menos una mayúscula. <br>
              - Al menos un número. <br>
              - Al menos un símbolo.
            </ion-text>
          </div>

          <ion-button (click)="registerUser()" [disabled]="!regForm.valid" expand="block" color="primary"> Registrarse </ion-button>

          <div class="ion-text-center">
            <ion-button color="dark" [routerLink]="['/sign-in']" fill="clear" expand="block">¿Ya tienes una cuenta? Inicia sesión aquí</ion-button>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
