<ion-content [fullscreen]="true">
  <ion-card-header>
    <ion-title size="large">Configuración</ion-title>
  </ion-card-header>

  <ion-list lines="full">
    <ion-item>
      <ion-label>
        <h2>Cuenta</h2>
        <p>Gestiona tu información de cuenta y seguridad.</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <h2>Nombre de usuario</h2>
        <p>Tu nombre de usuario actual.</p>
      </ion-label>
      </ion-item>
  </ion-list>

  <div class="spacer"></div>

  <div class="button-container">
    <ion-button expand="block" color="danger" (click)="logout()">Cerrar sesión</ion-button>
  </div>
</ion-content>
